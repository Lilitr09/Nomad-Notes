<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Metatags -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Nomad Notes - A travel blog documenting journeys and personal stories">
  <meta name="keywords" content="travel, blog, nomad, adventure, field notes">
  <meta property="og:title" content="Nomad Notes">
  <meta property="og:type" content="website">
  <!-- Title -->
  <title>Nomad Notes | Travel Blog</title>
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="./nomad-notes-logo.png">
  <!-- Styles -->
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="journal-container">
    <aside class="sidebar header">
      <div class="sidebar-content">
        <img src="./nomad-notes-logo.png" class="logo" alt="Nomad-Notes logo">
        <nav class="nav-menu">
          <a href="./index.html" class="active">Home</a>
          <a href="./destinations.html">Field Notes</a>
          <a href="./author.html">The Nomad</a>
        </nav>
        <div class="sidebar-footer">
          <p>Est. 2026</p>
        </div>
      </div>
    </aside>
    
    <main class="content">
      <section class="hero-section">
        <div class="hero-overlay"></div>
        <div class="hero-content">
          <h1>Every journey starts with a single note.</h1>
          <label for="email" class="headline-note block">Where do I find you?</label>
          <input type="email" id="email"><br>

          <button class="call-to-action-btn" type="button">Get on board, wanderer!</button>
        </div>
        

        <img class="corner-top-right" src="./vintage-corner.png" width="200" loading="lazy" alt="vintange corner">
        <img class="corner-top-left" src="./vintage-corner.png" width="200" loading="lazy" alt="vintange corner">
        <img class="corner-bottom-right" src="./vintage-corner.png" width="200" loading="lazy" alt="vintange corner">
        <img class="corner-bottom-left" src="./vintage-corner.png" width="200" loading="lazy" alt="vintange corner">
        <img class="compass" src="./compass-icon.png" alt="" width="150" loading="lazy" alt="vintange compass">
      </section>
    </main>

  </div>

</body>
</html>
